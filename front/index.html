<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickethack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="index_body">

<nav class="navbar navbar-light bg-white shadow-sm p-3">
  <div class="container">
    <a class="navbar-brand fw-bold text-success" href="#">Tickethack</a>
    <div>
      <a href="cart.html" class="me-3 text-dark">Cart</a>
      <a href="bookings.html" class="text-dark">Bookings</a>
    </div>
  </div>
</nav>

<header class="hero">
  <h1>Explore the world effortlessly by train!</h1>
  <p>Compare, book and enjoy cheap prices for train tickets: your journey starts on Tickethack.</p>
</header>

<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="search-box p-4">
    <input type="text" id="departure" class="form-control mb-2" placeholder="Departure">
    <input type="text" id="arrival" class="form-control mb-2" placeholder="Arrival">
    <input type="date" id="date" class="form-control mb-3">
    <button id="searchBtn" class="btn btn-success w-100">Search</button>
  </div>
  <div class="info-box text-center p-4">
    <img src="images/train.png" alt="Train Icon" width="50">
    <p class="mt-3">It's time to book your future trip.</p>
  </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
